# CI con los workflows reutilizables de hecian-lc/.github.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: hecian-lc/.github/.github/workflows/ci-node.yml@v1
    with:
      directorio: frontend

  backend:
    uses: hecian-lc/.github/.github/workflows/ci-python.yml@v1
    with:
      directorio: backend
      python: '3.12'

  # gitleaks sobre todo el historial y npm audit de producción (high+).
  seguridad:
    uses: hecian-lc/.github/.github/workflows/seguridad.yml@v1
    with:
      auditar_npm: |
        frontend

  # Avisa lo que falta para la marca (LICENSE, package.json, firma). Pasar a
  # estricto: true cuando el repo esté en la marca.
  marca:
    uses: hecian-lc/.github/.github/workflows/marca.yml@v1
    with:
      estricto: false
